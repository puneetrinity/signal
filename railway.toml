# Railway configuration
# Start command should be set per-service in Railway dashboard:
# - signal: npm run start (default)
# - sourcing-worker: npm run worker:sourcing

[build]
builder = "nixpacks"

[deploy]
# Don't set startCommand here - let each service configure its own in dashboard
#
# healthcheckPath is NOT set here because this railway.toml is shared across
# both services (signal, sourcing-worker). Each service has a
# different health endpoint:
#   - signal:          /api/health   (set in Railway dashboard)
#   - worker-sourcing: /health       (set in Railway dashboard)
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Runtime starts execute a read-only schema-ready assertion before serving or
# consuming. Schema changes run only through the manual one-shot descriptor in
# railway.schema-release.json. A genuinely empty disposable development
# database uses the explicit guarded bootstrap; it is never automatic.
